{{define "content"}}
<div class="space-y-8">
    <h1 class="text-2xl font-bold text-ctp-text">Settings</h1>

    <div class="bg-ctp-surface0 rounded-xl border border-ctp-surface1 p-6">
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-semibold text-ctp-text">Categories</h2>
            <button onclick="document.getElementById('new-cat-modal').classList.remove('hidden')"
                class="bg-ctp-blue text-ctp-crust px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-ctp-sapphire transition-colors">
                + Add
            </button>
        </div>
        <div id="categories-list">
            {{template "categories-list" .Categories}}
        </div>
    </div>

    <div class="bg-ctp-surface0 rounded-xl border border-ctp-surface1 p-6">
        <div class="flex items-center justify-between mb-4">
            <h2 class="text-lg font-semibold text-ctp-text">Tags</h2>
            <button onclick="document.getElementById('new-tag-modal').classList.remove('hidden')"
                class="bg-ctp-blue text-ctp-crust px-3 py-1.5 rounded-lg text-sm font-medium hover:bg-ctp-sapphire transition-colors">
                + Add
            </button>
        </div>
        <div id="tags-list">
            {{template "tags-list" .Tags}}
        </div>
    </div>
</div>

<div id="new-cat-modal" class="hidden fixed inset-0 bg-ctp-crust/70 flex items-center justify-center z-50 p-4">
    <div class="bg-ctp-surface0 rounded-xl shadow-xl shadow-ctp-crust/50 w-full max-w-md p-6 border border-ctp-surface1" onclick="event.stopPropagation()">
        <h2 class="text-lg font-semibold text-ctp-text mb-4">New Category</h2>
        <form hx-post="settings/categories" hx-target="#categories-list" hx-swap="innerHTML"
            hx-on::after-request="if(event.detail.successful) { document.getElementById('new-cat-modal').classList.add('hidden'); this.reset(); }">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-ctp-subtext1 mb-1">Name</label>
                    <input type="text" name="name" required class="w-full rounded-lg border border-ctp-surface2 bg-ctp-base px-3 py-2 text-sm text-ctp-text focus:ring-2 focus:ring-ctp-blue focus:border-ctp-blue outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-ctp-subtext1 mb-1">Color</label>
                    <input type="color" name="color" value="#89B4FA" class="w-full h-10 rounded-lg border border-ctp-surface2 bg-ctp-base cursor-pointer">
                </div>
                <div>
                    <label class="block text-sm font-medium text-ctp-subtext1 mb-1">Icon (emoji)</label>
                    <input type="text" name="icon" value="📁" maxlength="4" class="w-20 rounded-lg border border-ctp-surface2 bg-ctp-base px-3 py-2 text-sm text-center text-ctp-text focus:ring-2 focus:ring-ctp-blue focus:border-ctp-blue outline-none">
                </div>
            </div>
            <div class="flex justify-end space-x-3 mt-6">
                <button type="button" onclick="document.getElementById('new-cat-modal').classList.add('hidden')"
                    class="px-4 py-2 text-sm font-medium text-ctp-subtext1 hover:bg-ctp-surface1 rounded-lg transition-colors">Cancel</button>
                <button type="submit"
                    class="px-4 py-2 text-sm font-medium text-ctp-crust bg-ctp-blue hover:bg-ctp-sapphire rounded-lg transition-colors">Create</button>
            </div>
        </form>
    </div>
</div>

<div id="new-tag-modal" class="hidden fixed inset-0 bg-ctp-crust/70 flex items-center justify-center z-50 p-4">
    <div class="bg-ctp-surface0 rounded-xl shadow-xl shadow-ctp-crust/50 w-full max-w-md p-6 border border-ctp-surface1" onclick="event.stopPropagation()">
        <h2 class="text-lg font-semibold text-ctp-text mb-4">New Tag</h2>
        <form hx-post="settings/tags" hx-target="#tags-list" hx-swap="innerHTML"
            hx-on::after-request="if(event.detail.successful) { document.getElementById('new-tag-modal').classList.add('hidden'); this.reset(); }">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-ctp-subtext1 mb-1">Name</label>
                    <input type="text" name="name" required class="w-full rounded-lg border border-ctp-surface2 bg-ctp-base px-3 py-2 text-sm text-ctp-text focus:ring-2 focus:ring-ctp-blue focus:border-ctp-blue outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-ctp-subtext1 mb-1">Color</label>
                    <input type="color" name="color" value="#CBA6F7" class="w-full h-10 rounded-lg border border-ctp-surface2 bg-ctp-base cursor-pointer">
                </div>
            </div>
            <div class="flex justify-end space-x-3 mt-6">
                <button type="button" onclick="document.getElementById('new-tag-modal').classList.add('hidden')"
                    class="px-4 py-2 text-sm font-medium text-ctp-subtext1 hover:bg-ctp-surface1 rounded-lg transition-colors">Cancel</button>
                <button type="submit"
                    class="px-4 py-2 text-sm font-medium text-ctp-crust bg-ctp-blue hover:bg-ctp-sapphire rounded-lg transition-colors">Create</button>
            </div>
        </form>
    </div>
</div>

<script>
document.getElementById('new-cat-modal').addEventListener('click', function(e) {
    if (e.target === this) this.classList.add('hidden');
});
document.getElementById('new-tag-modal').addEventListener('click', function(e) {
    if (e.target === this) this.classList.add('hidden');
});
</script>
{{end}}
