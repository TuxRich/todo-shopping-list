{{define "content"}}
<div class="space-y-6">
    <div class="flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <a href="todos" class="text-ctp-overlay1 hover:text-ctp-text transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            </a>
            <h1 class="text-2xl font-bold text-ctp-text" id="list-title">{{.List.Name}}</h1>
            {{if .List.Category}}
            <span class="px-2 py-0.5 rounded-full text-xs font-medium" style="background-color: {{.List.Category.Color}}20; color: {{.List.Category.Color}}">
                {{.List.Category.Icon}} {{.List.Category.Name}}
            </span>
            {{end}}
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="document.getElementById('edit-list-modal').classList.remove('hidden')"
                class="text-ctp-overlay1 hover:text-ctp-text p-2 rounded-lg hover:bg-ctp-surface0 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
            </button>
            <button hx-delete="todos/{{.List.ID}}" hx-confirm="Delete this list and all its items?" hx-target="body" hx-swap="outerHTML"
                class="text-ctp-overlay1 hover:text-ctp-red p-2 rounded-lg hover:bg-ctp-red/10 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
            </button>
        </div>
    </div>

    <form hx-post="todos/{{.List.ID}}/items" hx-target="#items-list" hx-swap="innerHTML" hx-boost="false"
        hx-on::after-request="if(event.detail.successful) this.reset()"
        class="bg-ctp-surface0 rounded-xl border border-ctp-surface1 p-4">
        <div class="flex flex-col sm:flex-row gap-3">
            <input type="text" name="title" placeholder="Add a new task..." required
                class="flex-1 rounded-lg border border-ctp-surface2 bg-ctp-base px-3 py-2 text-sm text-ctp-text placeholder-ctp-overlay0 focus:ring-2 focus:ring-ctp-blue focus:border-ctp-blue outline-none">
            <div class="flex gap-2">
                <input type="date" name="deadline" class="rounded-lg border border-ctp-surface2 bg-ctp-base px-3 py-2 text-sm text-ctp-text focus:ring-2 focus:ring-ctp-blue focus:border-ctp-blue outline-none" title="Deadline">
                <button type="submit" class="bg-ctp-blue text-ctp-crust px-4 py-2 rounded-lg text-sm font-medium hover:bg-ctp-sapphire transition-colors whitespace-nowrap">Add</button>
            </div>
        </div>
        <div class="flex flex-wrap gap-3 mt-3">
            <div class="flex items-center gap-1">
                <label class="text-xs text-ctp-subtext0">From:</label>
                <input type="date" name="date_start" class="rounded border border-ctp-surface2 bg-ctp-base px-2 py-1 text-xs text-ctp-text focus:ring-1 focus:ring-ctp-blue outline-none">
            </div>
            <div class="flex items-center gap-1">
                <label class="text-xs text-ctp-subtext0">To:</label>
                <input type="date" name="date_end" class="rounded border border-ctp-surface2 bg-ctp-base px-2 py-1 text-xs text-ctp-text focus:ring-1 focus:ring-ctp-blue outline-none">
            </div>
            {{if .Tags}}
            <div class="flex items-center gap-1">
                <label class="text-xs text-ctp-subtext0">Tags:</label>
                <div class="flex flex-wrap gap-1">
                    {{range .Tags}}
                    <label class="inline-flex items-center">
                        <input type="checkbox" name="tag_ids" value="{{.ID}}" class="sr-only peer">
                        <span class="px-2 py-0.5 rounded-full text-xs cursor-pointer border peer-checked:text-white transition-colors"
                            style="border-color: {{.Color}}; color: {{.Color}}"
                            onclick="this.previousElementSibling.checked = !this.previousElementSibling.checked; this.style.backgroundColor = this.previousElementSibling.checked ? '{{.Color}}' : 'transparent'; this.style.color = this.previousElementSibling.checked ? 'white' : '{{.Color}}'">
                            {{.Name}}
                        </span>
                    </label>
                    {{end}}
                </div>
            </div>
            {{end}}
        </div>
    </form>

    <div id="items-list">
        {{template "todo-items-list" .}}
    </div>
</div>

<div id="edit-list-modal" class="hidden fixed inset-0 bg-ctp-crust/70 flex items-center justify-center z-50 p-4">
    <div class="bg-ctp-surface0 rounded-xl shadow-xl shadow-ctp-crust/50 w-full max-w-md p-6 border border-ctp-surface1" onclick="event.stopPropagation()">
        <h2 class="text-lg font-semibold text-ctp-text mb-4">Edit List</h2>
        <form hx-put="todos/{{.List.ID}}" hx-target="body" hx-swap="outerHTML">
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-ctp-subtext1 mb-1">Name</label>
                    <input type="text" name="name" value="{{.List.Name}}" required
                        class="w-full rounded-lg border border-ctp-surface2 bg-ctp-base px-3 py-2 text-sm text-ctp-text focus:ring-2 focus:ring-ctp-blue focus:border-ctp-blue outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-ctp-subtext1 mb-1">Category</label>
                    <select name="category_id" class="w-full rounded-lg border border-ctp-surface2 bg-ctp-base px-3 py-2 text-sm text-ctp-text focus:ring-2 focus:ring-ctp-blue focus:border-ctp-blue outline-none">
                        <option value="">None</option>
                        {{range .Categories}}
                        <option value="{{.ID}}" {{if and $.List.CategoryID (eq (derefInt64 $.List.CategoryID) .ID)}}selected{{end}}>{{.Icon}} {{.Name}}</option>
                        {{end}}
                    </select>
                </div>
            </div>
            <div class="flex justify-end space-x-3 mt-6">
                <button type="button" onclick="document.getElementById('edit-list-modal').classList.add('hidden')"
                    class="px-4 py-2 text-sm font-medium text-ctp-subtext1 hover:bg-ctp-surface1 rounded-lg transition-colors">Cancel</button>
                <button type="submit"
                    class="px-4 py-2 text-sm font-medium text-ctp-crust bg-ctp-blue hover:bg-ctp-sapphire rounded-lg transition-colors">Save</button>
            </div>
        </form>
    </div>
</div>

<div id="edit-item-modal" class="hidden fixed inset-0 bg-ctp-crust/70 flex items-center justify-center z-50 p-4">
    <div class="bg-ctp-surface0 rounded-xl shadow-xl shadow-ctp-crust/50 w-full max-w-lg p-6 border border-ctp-surface1" onclick="event.stopPropagation()" id="edit-item-content">
    </div>
</div>

<script>
document.getElementById('edit-list-modal').addEventListener('click', function(e) {
    if (e.target === this) this.classList.add('hidden');
});
document.getElementById('edit-item-modal').addEventListener('click', function(e) {
    if (e.target === this) this.classList.add('hidden');
});
</script>
{{end}}
