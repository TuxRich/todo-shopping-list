{{define "base"}}
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{if .Title}}{{.Title}} - {{end}}ToDo & Shopping</title>
    <base href="{{.BasePath}}">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <link rel="stylesheet" href="static/css/style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ctp: {
                            rosewater: '#F5E0DC',
                            flamingo: '#F2CDCD',
                            pink: '#F5C2E7',
                            mauve: '#CBA6F7',
                            red: '#F38BA8',
                            maroon: '#EBA0AC',
                            peach: '#FAB387',
                            yellow: '#F9E2AF',
                            green: '#A6E3A1',
                            teal: '#94E2D5',
                            sky: '#89DCEB',
                            sapphire: '#74C7EC',
                            blue: '#89B4FA',
                            lavender: '#B4BEFE',
                            text: '#CDD6F4',
                            subtext1: '#BAC2DE',
                            subtext0: '#A6ADC8',
                            overlay2: '#9399B2',
                            overlay1: '#7F849C',
                            overlay0: '#6C7086',
                            surface2: '#585B70',
                            surface1: '#45475A',
                            surface0: '#313244',
                            base: '#1E1E2E',
                            mantle: '#181825',
                            crust: '#11111B',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="h-full bg-ctp-base text-ctp-text" hx-boost="true">
    <div class="min-h-full">
        <nav class="bg-ctp-mantle shadow-lg shadow-ctp-crust/50">
            <div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
                <div class="flex h-14 items-center justify-between">
                    <div class="flex items-center space-x-8">
                        <a href="./" class="text-ctp-text font-bold text-lg tracking-tight">ToDo & Shopping</a>
                        <div class="hidden md:flex space-x-1">
                            <a href="todos" class="text-ctp-subtext0 hover:bg-ctp-surface0 hover:text-ctp-text px-3 py-2 rounded-md text-sm font-medium transition-colors {{if eq .ActiveNav "todos"}}bg-ctp-surface0 text-ctp-blue{{end}}">Todo Lists</a>
                            <a href="shopping" class="text-ctp-subtext0 hover:bg-ctp-surface0 hover:text-ctp-text px-3 py-2 rounded-md text-sm font-medium transition-colors {{if eq .ActiveNav "shopping"}}bg-ctp-surface0 text-ctp-blue{{end}}">Shopping Lists</a>
                            <a href="settings" class="text-ctp-subtext0 hover:bg-ctp-surface0 hover:text-ctp-text px-3 py-2 rounded-md text-sm font-medium transition-colors {{if eq .ActiveNav "settings"}}bg-ctp-surface0 text-ctp-blue{{end}}">Settings</a>
                        </div>
                    </div>
                </div>
            </div>
            <div class="md:hidden border-t border-ctp-surface0">
                <div class="flex justify-around py-1">
                    <a href="todos" class="text-ctp-subtext0 hover:text-ctp-text px-3 py-2 text-xs font-medium {{if eq .ActiveNav "todos"}}text-ctp-blue{{end}}">Todos</a>
                    <a href="shopping" class="text-ctp-subtext0 hover:text-ctp-text px-3 py-2 text-xs font-medium {{if eq .ActiveNav "shopping"}}text-ctp-blue{{end}}">Shopping</a>
                    <a href="settings" class="text-ctp-subtext0 hover:text-ctp-text px-3 py-2 text-xs font-medium {{if eq .ActiveNav "settings"}}text-ctp-blue{{end}}">Settings</a>
                </div>
            </div>
        </nav>

        <main class="mx-auto max-w-5xl px-4 sm:px-6 lg:px-8 py-6">
            {{template "content" .}}
        </main>
    </div>

    <script src="static/js/app.js"></script>
</body>
</html>
{{end}}
